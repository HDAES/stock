[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-quant"
version = "0.1.0"
description = "US equity quant research system using Longbridge data"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.8",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
stock-quant = "stock_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
